name: Build Test App

on:
  push:
    branches: [dev]
env:
  REGISTRY: registry.kwamekert.com
  IMAGE_NAME: skulba-atlas

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Export IMAGE_TAG
        run: echo "IMAGE_TAG=${GITHUB_SHA::12}" >> $GITHUB_ENV

      - name: Build application
        run: npm run build:staging

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
        #  platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Checkout manifest repo
        uses: actions/checkout@v4
        with:
          repository: kwamekert/odin-stack
          ref: dev
          token: ${{ secrets.GITOPS_TOKEN }}
          path: manifests

      - name: Update atlas image
        working-directory: manifests
        run: |
          yq -i '
            (.spec.template.spec.containers[]
            | select(.name == "atlas-service")
            | .image) = "registry.kwamekert.com/skulba-atlas:'"${IMAGE_TAG}"'"
          ' base/skulba/atlas/deployment.yaml

      - name: Commit and push manifest update
        working-directory: manifests
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add base/skulba/atlas/deployment.yaml
          git diff --cached --quiet || \
            git commit -m "Deploy skulba-atlas ${GITHUB_SHA}"
          git push origin dev