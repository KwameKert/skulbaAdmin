<h2 class="f-w-500 m-b-24" mat-dialog-title>
  <strong>Generate Invoice</strong>
</h2>

<mat-dialog-content style="min-width: 420px">
  <form #generateForm="ngForm">
    <div class="row">
      <div class="col-lg-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Tenant</mat-label>
          <mat-select required name="tenantId" [(ngModel)]="selectedTenantId" [disabled]="isLoading">
            @for (t of tenants; track t.id) {
              <mat-option [value]="t.id">{{ t.name }}</mat-option>
            }
          </mat-select>
          <mat-hint>Generates a DRAFT invoice for the current month-to-date.</mat-hint>
        </mat-form-field>
      </div>
    </div>

    <div class="d-flex gap-16 m-t-8">
      <button
        mat-flat-button
        color="primary"
        [disabled]="!generateForm.valid || isLoading"
        (click)="doAction()">
        Generate
      </button>
      <button mat-stroked-button color="warn" (click)="closeDialog()">Cancel</button>
    </div>
  </form>
</mat-dialog-content>
